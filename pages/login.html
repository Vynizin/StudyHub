<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/StudyHub/css/reset.css">
	<link rel="stylesheet" href="/StudyHub/css/style.css">
    <title>StudyHub</title>
</head>
<body>
    <header>
        <img src="/StudyHub/assets/icons/IMG_1429.png" alt="Logo da StudyHub" width="200px" height="100px">
        <h1>Login</h1>
    </header>
    <main>
        <section>
            <form action="">
                <fieldset>
                    <div>
                        <label for="usuario">Usuario</label>
                        <input type="text" name="usuario" id="usuario">
                    </div>
                    <div>
                        <label for="senha">Senha</label>
                        <input type="password" name="senha" id="senha">
                    </div>
                    <div>
                        <button type="submit">Entrar</button>
                    </div>
                    <div>
                        <a href="#">Esqueceu a senha?</a>
                    </div>
                </fieldset>
            </form>
        </section>
    </main>
    <footer>
        	<section>
				<p>
					&copy;Todos os direitos reservados, 2026, StudyHub.
				</p>
			</section>
    </footer>
</body>

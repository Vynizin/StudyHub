<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/StudyHub/css/reset.css">
	<link rel="stylesheet" href="/StudyHub/css/style.css">
    <title>StudyHub</title>
</head>
<body>
    <header>
        <img src="/StudyHub/assets/icons/IMG_1429.png" alt="Logo da StudyHub" width="200px" height="100px">
        <h1>Cadastro</h1>
    </header>
    <main>
        <section>
            <form action="">
                <fieldset>
                    <div>
                        <label for="nome">Nome Completo</label>
                        <input type="text" name="nome" id="nome" placeholder="Digite seu nome...">
                    </div>
                    <div>
                        <label for="email">Email</label>
                        <input type="email" name="email" id="email" placeholder="Digite seu email...">
                    </div>
                    <div>
                        <label for="usuario">Usuario</label>
                        <input type="text" name="usuario" id="usuario" placeholder="Digite seu usuario...">
                    </div>
                    <div>
                        <label for="nascimento">Data de Nascimento</label>
                        <input type="date" name="nascimento" id="nascimento">
                    </div>
                    <div>
                        <label for="senha">Senha</label>
                        <input type="password" name="senha" id="senha">
                    </div>
                    <div>
                        <label for="senhaConfirmacao">Confirme sua senha</label>
                        <input type="password" name="senhaConfirmacao" id="senhaConfirmacao">
                    </div>
                    <div>
                        <button type="submit">Cadastrar</button>
                    </div>
                </fieldset>
            </form>
        </section>
    </main>
    <footer>
        <section>
			<p>
				&copy;Todos os direitos reservados, 2026, StudyHub.
			</p>
		</section>
    </footer>
</body>
</html>
